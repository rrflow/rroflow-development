name: release-on-version
# Publication starts only after exact main-push CI, never concurrently with it.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: release-on-version
  cancel-in-progress: false
jobs:
  check:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RELEASE_SOURCE_REF: ${{ github.event_name == 'workflow_run' && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Qualify exact CI, reserve immutable tag and dispatch
        run: node scripts/release-gate.mjs dispatch
      - name: Retain publication decision
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-qualification-${{ env.RELEASE_SHA }}
          path: release-qualification.json
          if-no-files-found: error
