name: release-on-version
# When main carries a `rroflow` SDK version that has no GitHub Release yet, start the release
# workflow (dist, dispatch mode) with tag v<version>. The release job creates the tag on the
# commit it builds, so publishing a version is: bump crates/rroflow-cli/Cargo.toml, merge.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: release-on-version
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Version of the rroflow SDK
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/rroflow-cli/Cargo.toml | head -n 1)
          test -n "$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Start the release when this version has none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released; nothing to do"
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
          echo "started the release of $TAG"
