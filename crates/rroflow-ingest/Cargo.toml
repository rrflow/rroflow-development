[package]
name = "rroflow-ingest"
version = "0.4.0"
description = "rroflow.ai ingest: receives rroflow.turn/v1 records and files them into the sender's devspace"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
# aws_lc_rs: the signature backend (as the Devagotchi hub uses); without one jsonwebtoken 10 panics on first use.
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
rand = "0.9"
rroflow-core = { path = "../rroflow-core" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "json", "chrono"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
toml = "1.1.8"

[dev-dependencies]
aws-lc-rs = "1"
tempfile = "3"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
sha2 = "0.11.1"

# Released for the Linux servers that run rroflow.ai; they pull and verify it (docs/deploy/README.md).
# Not a user download, so no installers. Its version moves with the `rroflow` CLI's: one tag
# releases both.
[package.metadata.dist]
dist = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
installers = []
