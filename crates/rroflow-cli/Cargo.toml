[package]
name = "rroflow"
description = "rroflow.ai collector: reads Claude Code and Codex sessions, computes behaviour signals, sends turns to rroflow.ai or Raindrop"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rroflow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.9"
regex = "1"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rroflow-core = { path = "../rroflow-core" }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
axum = "0.8.9"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[package.metadata.dist]
dist = true
