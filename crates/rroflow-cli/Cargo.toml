[package]
name = "rroflow"
description = "rroflow.ai collector: reads Claude Code and Codex sessions, computes behaviour signals, sends turns to rroflow.ai or Raindrop"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rroflow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.9"
regex = "1"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rroflow-core = { path = "../rroflow-core" }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4", "v5"] }
