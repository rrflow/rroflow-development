[workspace]
members = ["cargo:."]

# Config for 'dist' (same tool, version and layout as EonsofStupid/devagotchi)
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax): Windows and Linux, x86_64 and ARM64
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Signed provenance for every artifact (GitHub artifact attestations)
github-attestations = true

# Build each released package on its own: the `rroflow` SDK (every target, with installers)
# and `rroflow-ingest` (Linux only, no installers; servers pull it). Both share one version.
precise-builds = true

# Build and upload the artifacts on pull requests too, so every target is proven before merge
pr-run-mode = "upload"

# Releases are started by workflow_dispatch with the tag as input (release-on-version.yml does
# this only after exact main-push CI passes); the gate reserves the verified version tag.
dispatch-releases = true

# release.yml is generated by dist 0.33.0 (copied from devagotchi, which generated it); dist
# refuses to run when the file differs from what it would write, so CI drift is allowed and
# `dist generate` still refreshes it.
allow-dirty = ["ci"]

# ARM64 builds run on native ARM runners, not cross-compiled. Linux uses the 22.04 image so the
# aarch64 binaries need the same glibc (2.35) as the x86_64 ones, which dist builds on ubuntu-22.04.
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
aarch64-pc-windows-msvc = "windows-11-arm"
